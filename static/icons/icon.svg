<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#000"/>
  <rect x="40" y="40" width="432" height="432" rx="72" fill="#0a0d11"
        stroke="#1d2530" stroke-width="8"/>
  <!-- antenna -->
  <line x1="256" y1="118" x2="256" y2="52" stroke="#2dd4bf" stroke-width="18"
        stroke-linecap="round"/>
  <circle cx="256" cy="46" r="14" fill="#2dd4bf"/>
  <!-- LCD window with 7-seg style frequency -->
  <rect x="96" y="130" width="320" height="130" rx="18" fill="#050708"
        stroke="#1d2530" stroke-width="6"/>
  <text x="256" y="222" font-family="Consolas,Menlo,monospace" font-size="76"
        font-weight="bold" fill="#fbbf24" text-anchor="middle"
        letter-spacing="2">145.5</text>
  <!-- S-meter bars -->
  <g fill="#2dd4bf">
    <rect x="120" y="300" width="30" height="26" rx="4"/>
    <rect x="160" y="292" width="30" height="34" rx="4"/>
    <rect x="200" y="284" width="30" height="42" rx="4"/>
    <rect x="240" y="276" width="30" height="50" rx="4"/>
    <rect x="280" y="268" width="30" height="58" rx="4"/>
  </g>
  <g fill="#1d2530">
    <rect x="320" y="260" width="30" height="66" rx="4"/>
    <rect x="360" y="252" width="30" height="74" rx="4"/>
  </g>
  <!-- PTT button -->
  <circle cx="256" cy="404" r="44" fill="none" stroke="#2dd4bf"
          stroke-width="12"/>
  <circle cx="256" cy="404" r="18" fill="#f87171"/>
</svg>
