name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ---- multi-arch Docker image -> ghcr.io -------------------------------
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- native single-file executables -----------------------------------
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest          # amd64
            artifact: VR-N7600-Remote-linux-amd64
            built: "dist/VR-N7600 Remote"
          - os: ubuntu-24.04-arm       # arm64 (Pi 4/5 class and up)
            artifact: VR-N7600-Remote-linux-arm64
            built: "dist/VR-N7600 Remote"
          - os: windows-latest
            artifact: VR-N7600-Remote-windows-x64.exe
            built: "dist/VR-N7600 Remote.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Install pywebview (native window, Windows only)
        if: runner.os == 'Windows'
        run: pip install pywebview
      - name: Build
        run: python build.py
      - name: Rename to artifact name
        shell: bash
        run: mv "${{ matrix.built }}" "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  # ---- attach binaries to the release on version tags -------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
